<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GLemples</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #ui {
        position: fixed;
        top: 12px;
        right: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-family: monospace;
        font-size: 12px;
        color: #ccc;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
      }
      /* focus-within keeps the panel reachable by keyboard on any device. */
      body:focus-within #ui {
        opacity: 1;
        pointer-events: all;
      }

      #btnToggleUi {
        display: none;
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 1;
        width: 32px;
        height: 32px;
        line-height: 1;
      }

      /* Pointer devices: hovering anywhere reveals the panel, so the explicit
         toggle would only get in its way — it stays hidden. */
      @media (hover: hover) {
        body:hover #ui {
          opacity: 1;
          pointer-events: all;
        }
      }

      /* Touch devices never hover, so the toggle is the only way in. */
      @media (hover: none) {
        #btnToggleUi {
          display: block;
        }
        body.ui-open #ui {
          opacity: 1;
          pointer-events: all;
        }
        body.ui-open #btnToggleUi {
          display: none;
        }
      }

      #ui label {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
      }
      #ui input[type="range"] {
        width: 100px;
      }
      #ui button,
      #btnToggleUi {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #ccc;
        padding: 3px 8px;
        cursor: pointer;
        font-family: monospace;
        font-size: 12px;
      }
      #ui button:hover,
      #btnToggleUi:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      #fps {
        position: fixed;
        bottom: 8px;
        left: 8px;
        font-family: monospace;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.4);
        pointer-events: none;
      }

      #texname {
        position: fixed;
        bottom: 8px;
        right: 8px;
        font-family: monospace;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.4);
        pointer-events: none;
      }

      #dropzone {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        font-family: monospace;
        font-size: 18px;
        color: rgba(255, 255, 255, 0.7);
        border: 3px dashed rgba(255, 255, 255, 0.3);
        pointer-events: none;
      }
      body.dragging #dropzone {
        display: flex;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>

    <button id="btnToggleUi" aria-label="Show controls" aria-expanded="false">
      ☰
    </button>

    <div id="ui">
      <!-- Slider ranges and positions are both set at startup from the slider
           table in app/ui.ts, which is also where the value mappings live. -->
      <label>Motion blur <input type="range" id="blur" /></label>
      <label>Warp amount <input type="range" id="warp" /></label>
      <label>Zoom <input type="range" id="zoom" /></label>
      <label>Speed <input type="range" id="speed" /></label>
      <label>Texture interval <input type="range" id="texint" /></label>
      <button id="btnNextTex">Next texture (Space)</button>
      <button id="btnPause">Pause (P)</button>
      <button id="btnFullscreen">Fullscreen (F)</button>
      <div style="color: rgba(255, 255, 255, 0.35); margin-top: 4px">
        Drop images to load them
      </div>
    </div>

    <div id="fps"></div>
    <div id="texname"></div>
    <div id="dropzone">Drop images here</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
